name: Windows installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Build application icon and manifest resources
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          Push-Location host
          go-winres make --arch amd64,arm64 --file-version 0.1.10.0 --product-version 0.1.10.0
          if ($LASTEXITCODE) { throw 'Windows resources failed' }
          Pop-Location
      - name: Compile native Windows apps
        shell: pwsh
        run: |
          $env:CGO_ENABLED='0'; $env:GOOS='windows'
          foreach ($arch in @('amd64','arm64')) {
            $env:GOARCH=$arch
            New-Item -ItemType Directory -Force "build/windows-$arch" | Out-Null
            go build -trimpath -ldflags '-s -w -H=windowsgui' -o "build/windows-$arch/fracture.exe" ./host
            if ($LASTEXITCODE) { throw 'Go build failed' }
          }
      - name: Compile Inno Setup installers
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is missing from runner' }
          foreach ($arch in @('amd64','arm64')) {
            & $compiler "/DArch=$arch" install/fracture.iss
            if ($LASTEXITCODE) { throw 'Inno Setup failed' }
          }
      - name: Exercise installer, native window and uninstaller
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'FractureOS-acceptance'
          $installer = Get-ChildItem build/inno/*-amd64-setup.exe | Select-Object -First 1
          $p = Start-Process $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dest`"" -Wait -PassThru
          if ($p.ExitCode) { throw "Installer exit $($p.ExitCode)" }
          $p = Start-Process "$dest/fracture.exe" -ArgumentList dashboard -PassThru
          Start-Sleep -Seconds 5
          $p.Refresh()
          if ($p.HasExited -or !$p.MainWindowHandle) { throw 'Native dashboard did not open' }
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class FractureWindow {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string n);
            public delegate bool WindowCallback(IntPtr h, IntPtr p);
            [DllImport("user32.dll")] public static extern bool EnumWindows(WindowCallback c, IntPtr p);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint p);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, System.Text.StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern IntPtr GetDlgItem(IntPtr h, int id);
            [DllImport("user32.dll", CharSet=CharSet.Unicode, EntryPoint="SendMessageW")] public static extern IntPtr SetText(IntPtr h, uint m, IntPtr w, string s);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
          }
          '@
          [void][FractureWindow]::SendMessage($p.MainWindowHandle,0x111,[IntPtr]102,[IntPtr]::Zero)
          $inputHandle=[FractureWindow]::GetDlgItem($p.MainWindowHandle,230)
          if (!$inputHandle) { throw 'Connection input is missing' }
          $changed=[FractureWindow]::SetText($inputHandle,0x0c,[IntPtr]::Zero,'https://127.0.0.1:47832')
          if (!$changed) { throw 'Cross-process WM_SETTEXT failed' }
          [void][FractureWindow]::SendMessage($p.MainWindowHandle,0x111,[IntPtr]235,[IntPtr]::Zero)
          $saved=Get-Content "$env:APPDATA/fracture-v3/config.json" -Raw | ConvertFrom-Json
          if ($saved.hub -ne 'https://127.0.0.1:47832') { throw "Native connection settings did not persist: $($saved.hub)" }
          foreach ($tab in @(101,102,103,104,105,100)) {
            [void][FractureWindow]::SendMessage($p.MainWindowHandle,0x111,[IntPtr]$tab,[IntPtr]::Zero)
            Start-Sleep -Milliseconds 300
            $p.Refresh(); if ($p.HasExited) { throw "Dashboard crashed on tab $tab" }
          }
          "Dashboard working set: $($p.WorkingSet64) bytes; window: $($p.MainWindowHandle)" | Tee-Object build/inno/validation.txt
          Add-Type -AssemblyName System.Drawing,System.Windows.Forms
          $screen=[System.Windows.Forms.SystemInformation]::VirtualScreen
          $image=New-Object System.Drawing.Bitmap($screen.Width,$screen.Height)
          $graphics=[System.Drawing.Graphics]::FromImage($image)
          try { $graphics.CopyFromScreen($screen.Left,$screen.Top,0,0,$image.Size); $image.Save("$pwd/build/inno/dashboard.png") } finally { $graphics.Dispose(); $image.Dispose() }
          # Exercise the same staged helper used by the Update button.
          $helper=Join-Path $env:RUNNER_TEMP 'fracture-updater.exe'
          Copy-Item "$dest/fracture.exe" $helper
          $stagedInstaller=Join-Path $env:RUNNER_TEMP $installer.Name
          Copy-Item $installer.FullName $stagedInstaller
          $update=Start-Process $helper -ArgumentList 'apply-update',"`"$stagedInstaller`"","`"$dest`"","`"$dest/fracture.exe`"" -PassThru
          if (!$update.WaitForExit(60000) -or $update.ExitCode) { throw 'Update helper failed' }
          Start-Sleep -Seconds 4
          $new=Get-Process fracture | Where-Object { $_.Path -eq (Join-Path $dest "fracture.exe") }
          if (@($new).Count -lt 2) { throw 'Updater did not reopen dashboard and tray' }
          $saved=Get-Content "$env:APPDATA/fracture-v3/config.json" -Raw | ConvertFrom-Json
          if ($saved.hub -ne 'https://127.0.0.1:47832') { throw 'Update lost connection settings' }
          foreach ($proc in $new) { if ($proc.MainWindowHandle) { [void]$proc.CloseMainWindow() } }
          $tray=[FractureWindow]::FindWindow('FractureOSv3Tray',$null)
          if ($tray) { [void][FractureWindow]::SendMessage($tray,0x10,[IntPtr]::Zero,[IntPtr]::Zero) }
          $ids=@($new | ForEach-Object { $_.Id })
          $callback=[FractureWindow+WindowCallback]{param($window,$unused)
            [uint32]$owner=0; [void][FractureWindow]::GetWindowThreadProcessId($window,[ref]$owner)
            if ($ids -contains [int]$owner) {
              $name=New-Object System.Text.StringBuilder 256
              [void][FractureWindow]::GetClassName($window,$name,256)
              "Closing update window: $owner $name" | Add-Content build/inno/validation.txt
              [void][FractureWindow]::SendMessage($window,0x10,[IntPtr]::Zero,[IntPtr]::Zero)
            };return $true
          }
          [void][FractureWindow]::EnumWindows($callback,[IntPtr]::Zero)
          foreach ($proc in $new) { if (!$proc.WaitForExit(15000)) { throw "Updated app did not close: PID $($proc.Id), title $($proc.MainWindowTitle)" } }
          'In-place update preserved settings and reopened dashboard/tray' | Add-Content build/inno/validation.txt
          $u=Start-Process "$dest/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode) { throw "Uninstaller exit $($u.ExitCode)" }
          if (Test-Path "$dest/fracture.exe") { throw 'Uninstaller left executable behind' }
      - name: Hash artifacts
        shell: pwsh
        run: |
          Get-ChildItem build/inno/*-setup.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -Encoding ascii build/inno/WINDOWS-SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installers
          path: build/inno/
