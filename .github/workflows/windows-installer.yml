name: Windows MSIX packages
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Exact package Name reserved in Microsoft Partner Center
        required: true
        type: string
      publisher:
        description: Exact Publisher value from Partner Center
        required: true
        type: string
      publisher_display_name:
        description: Publisher display name registered in Partner Center
        required: true
        type: string
      package_version:
        description: Four-part MSIX version (for example 0.1.15.0)
        required: true
        type: string
        default: 0.1.15.0
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Build application icon and manifest resources
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          Push-Location host
          go-winres make --arch amd64,arm64 --file-version "$env:PACKAGE_VERSION" --product-version "$env:PACKAGE_VERSION"
          if ($LASTEXITCODE) { throw 'Windows resources failed' }
          Pop-Location
      - name: Compile native Windows apps
        shell: pwsh
        run: |
          $env:CGO_ENABLED='0'; $env:GOOS='windows'
          foreach ($arch in @('amd64','arm64')) {
            $env:GOARCH=$arch
            New-Item -ItemType Directory -Force "build/windows-$arch" | Out-Null
            go build -trimpath -ldflags '-s -w -H=windowsgui' -o "build/windows-$arch/fracture.exe" ./host
            if ($LASTEXITCODE) { throw 'Go build failed' }
          }
      - name: Compile shared home renderer for both architectures
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vc = Join-Path $vs 'VC/Auxiliary/Build/vcvarsall.bat'
          foreach ($entry in @(@('amd64','x64'),@('arm64','x64_arm64'))) {
            $arch=$entry[0]; $target=$entry[1]
            cmd /c "`"$vc`" $target && cl /nologo /LD /O2 /std:c11 /D_CRT_SECURE_NO_WARNINGS /Fobuild/windows-$arch/preview.obj device/src/preview.c /link /OUT:build/windows-$arch/fracture-preview.dll"
            if ($LASTEXITCODE) { throw "Home renderer build failed: $arch" }
          }
      - name: Exercise shared C home renderer
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class FracturePreview {
            [DllImport("kernel32.dll",CharSet=CharSet.Unicode)] public static extern IntPtr LoadLibrary(string p);
            [DllImport("fracture-preview.dll",CallingConvention=CallingConvention.Cdecl)] public static extern int FracturePreviewAssets(byte[] a,int n,byte[] f,int m);
            [DllImport("fracture-preview.dll",CallingConvention=CallingConvention.Cdecl)] public static extern int FracturePreviewRender([MarshalAs(UnmanagedType.LPStr)]string s,uint age,byte[] pixels,int n);
            [DllImport("fracture-preview.dll",CallingConvention=CallingConvention.Cdecl)] public static extern void FracturePreviewClose();
          }
          '@
          $dll=(Resolve-Path build/windows-amd64/fracture-preview.dll).Path
          if (![FracturePreview]::LoadLibrary($dll)) {throw 'Renderer could not load'}
          $pgm=[IO.File]::ReadAllBytes("$pwd/assets/faces/digit-atlas-nunito.pgm")
          $atlas=New-Object byte[] 170000;[Array]::Copy($pgm,16,$atlas,0,170000)
          $font=[IO.File]::ReadAllBytes("$pwd/assets/ui/default.bin")
          if (![FracturePreview]::FracturePreviewAssets($atlas,$atlas.Length,$font,$font.Length)) {throw 'Renderer rejected assets'}
          $lines=@('FPR1','now=1793100000','face=nunito','profile=0','appearance=0','alarm_hour=-1','telemetry=0','weather=0','media=0','notifications=0')
          Get-Content assets/faces/nunito.face | ForEach-Object {if ($_ -match '^[a-z0-9_]+=' -and $_ -notmatch '^layout=') {$lines += "face.$_"}}
          Get-Content assets/themes/midnight.theme | ForEach-Object {if ($_ -match '^[a-z0-9_]+=') {$lines += "theme.$_"}}
          $model=($lines -join "`n")+"`nEND`n"
          $pixels=New-Object byte[] 307200
          if (![FracturePreview]::FracturePreviewRender($model,0,$pixels,$pixels.Length)) {throw 'Renderer rejected model'}
          if (@($pixels | Where-Object {$_ -ne 0 -and $_ -ne 255}).Count -lt 1000) {throw 'Renderer produced an empty face'}
          if (![FracturePreview]::FracturePreviewRender($model,1250,$pixels,$pixels.Length)) {throw 'Renderer could not advance the clock locally'}
          [FracturePreview]::FracturePreviewClose()
      - name: Package unsigned MSIX for Microsoft Store submission
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_PUBLISHER: ${{ inputs.publisher }}
          PACKAGE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $name=$env:PACKAGE_NAME
          $publisher=$env:PACKAGE_PUBLISHER
          $publisherDisplayName=$env:PACKAGE_PUBLISHER_DISPLAY_NAME
          $version=$env:PACKAGE_VERSION
          if ($name -notmatch '^[A-Za-z0-9.]{3,50}$') { throw 'Invalid Partner Center package name' }
          if ($publisher -notmatch '^CN=[A-Za-z0-9 .,_=+-]{1,160}$') { throw 'Invalid Partner Center publisher value' }
          if (!$publisherDisplayName -or $publisherDisplayName.Length -gt 100 -or $publisherDisplayName -match '[<>"''\x00-\x1f]') { throw 'Invalid Partner Center publisher display name' }
          if ($version -notmatch '^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$') { throw 'Invalid four-part package version' }
          $sourceVersion=(Select-String -Path host/main.go -Pattern '^const version = "([0-9.]+)"').Matches.Groups[1].Value
          if (!$sourceVersion -or $version -ne "$sourceVersion.0") { throw 'Package version must match host/main.go' }
          $safePublisher=[System.Security.SecurityElement]::Escape($publisher)
          $safePublisherDisplayName=[System.Security.SecurityElement]::Escape($publisherDisplayName)
          $makeappxCommand=Get-Command MakeAppx.exe -ErrorAction SilentlyContinue
          if ($makeappxCommand) {
            $makeappx=$makeappxCommand.Source
          } else {
            $sdkRoot=Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $makeappx=(Get-ChildItem $sdkRoot -Filter MakeAppx.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            if (!$makeappx) { throw 'Windows SDK MakeAppx.exe is unavailable' }
          }
          $root=Join-Path $pwd 'build/msix'
          New-Item -ItemType Directory -Force $root | Out-Null
          Add-Type -AssemblyName System.Drawing
          $source=[System.Drawing.Image]::FromFile((Resolve-Path assets/branding/fracture.png).Path)
          $logoSizes=@(
            @{Name='Square44x44Logo.png';Width=44;Height=44},
            @{Name='Square150x150Logo.png';Width=150;Height=150},
            @{Name='StoreLogo.png';Width=50;Height=50}
          )
          try {
            foreach ($arch in @('amd64','arm64')) {
              $appxArch=if ($arch -eq 'amd64') { 'x64' } else { 'arm64' }
              $stage=Join-Path $root "stage-$arch"
              $assets=Join-Path $stage 'Assets'
              New-Item -ItemType Directory -Force $assets | Out-Null
              Copy-Item "build/windows-$arch/fracture.exe" $stage
              Copy-Item "build/windows-$arch/fracture-preview.dll" $stage
              foreach ($spec in $logoSizes) {
                $image=New-Object System.Drawing.Bitmap($spec.Width,$spec.Height)
                $graphics=[System.Drawing.Graphics]::FromImage($image)
                try {
                  $graphics.Clear([System.Drawing.Color]::Transparent)
                  $graphics.InterpolationMode=[System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                  $graphics.DrawImage($source,0,0,$spec.Width,$spec.Height)
                  $image.Save((Join-Path $assets $spec.Name),[System.Drawing.Imaging.ImageFormat]::Png)
                } finally { $graphics.Dispose(); $image.Dispose() }
              }
              $wide=New-Object System.Drawing.Bitmap(310,150)
              $graphics=[System.Drawing.Graphics]::FromImage($wide)
              try {
                $graphics.Clear([System.Drawing.Color]::FromArgb(9,13,20))
                $graphics.InterpolationMode=[System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                $graphics.DrawImage($source,80,0,150,150)
                $wide.Save((Join-Path $assets 'Wide310x150Logo.png'),[System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $graphics.Dispose(); $wide.Dispose() }
              $manifest=Get-Content install/msix/Package.appxmanifest.template -Raw
              $manifest=$manifest.Replace('__PACKAGE_NAME__',$name).Replace('__PUBLISHER__',$safePublisher).Replace('__PUBLISHER_DISPLAY_NAME__',$safePublisherDisplayName).Replace('__VERSION__',$version).Replace('__ARCH__',$appxArch)
              $manifestPath=Join-Path $stage 'AppxManifest.xml'
              [IO.File]::WriteAllText($manifestPath,$manifest,[Text.UTF8Encoding]::new($false))
              [xml]$parsed=Get-Content $manifestPath -Raw
              if (!$parsed.Package.Capabilities) { throw "Manifest capabilities missing for $arch" }
              $package=Join-Path $root "fracture-$version-windows-$arch.msix"
              & $makeappx pack /d $stage /p $package /o
              if ($LASTEXITCODE) { throw "MSIX package failed: $arch" }
              & $makeappx unpack /p $package /d (Join-Path $root "verify-$arch")
              if ($LASTEXITCODE) { throw "MSIX package validation failed: $arch" }
            }
          } finally { $source.Dispose() }
          $bundleDir=Join-Path $root 'bundle-input'
          New-Item -ItemType Directory -Force $bundleDir | Out-Null
          Copy-Item (Join-Path $root 'fracture-*-windows-amd64.msix') $bundleDir
          Copy-Item (Join-Path $root 'fracture-*-windows-arm64.msix') $bundleDir
          $bundle=Join-Path $root "fracture-$version-windows.msixbundle"
          & $makeappx bundle /d $bundleDir /p $bundle /bv $version /o
          if ($LASTEXITCODE) { throw 'MSIX bundle creation failed' }
          foreach ($dir in @('stage-amd64','stage-arm64','verify-amd64','verify-arm64','bundle-input')) {
            Remove-Item -LiteralPath (Join-Path $root $dir) -Recurse -Force
          }
      - name: Hash artifacts
        shell: pwsh
        run: |
          Get-ChildItem build/msix/*.msix,build/msix/*.msixbundle | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content -Encoding ascii build/msix/SHA256SUMS
          'Unsigned packages target Partner Center submission. Store signing, policy review, listing, and install/runtime checks remain required before release.' | Set-Content build/msix/STORE-SUBMISSION-STATUS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-msix-store-submission
          path: build/msix/
